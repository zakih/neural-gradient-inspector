services:
  notebook:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: pinn-notebook
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --NotebookApp.token='' --NotebookApp.notebook_dir=/app
    restart: unless-stopped

  mlflow:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: pinn-mlflow
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    working_dir: /app
    # Share the runs/ directory with the notebook service so experiments show up
    # in the UI in real time.
    command: >
      mlflow ui --host 0.0.0.0 --port 5000
      --backend-store-uri /app/runs/mlflow
    restart: unless-stopped
